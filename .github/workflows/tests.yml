name: tests

"on":
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows-tests:
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.8"
            requirements: requirements-robot.txt
          - python-version: "3.11"
            requirements: requirements.txt
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: ${{ matrix.requirements }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r ${{ matrix.requirements }}
      - name: Verify RoboMaster SDK import
        if: matrix.python-version == '3.8'
        run: python -c "from robomaster import robot, version; print(version.__version__)"
      - name: Compile source
        run: |
          python -m py_compile autonomy.py navigation.py dashboard.py scenario_profiles.py lego_vision.py lego_identification.py robomaster_yolo_ai.py
      - name: Run tests
        run: python -m unittest discover -s tests -v
